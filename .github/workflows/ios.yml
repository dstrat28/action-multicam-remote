name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep vendor SDK distributions out of Git
        run: sh ci_scripts/check_vendor_sdk_exclusion.sh

      - name: Check private SDK provisioning
        run: python3 -B Tests/Insta360SDKCloudRegression.py

      - name: Select Xcode
        run: xcodebuild -version

      - name: Check diagnostic log archive
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Services/DiagnosticLogArchive.swift \
            Tests/DiagnosticLogArchiveRegression.swift \
            -o "$RUNNER_TEMP/diagnostic-log-regression"
          "$RUNNER_TEMP/diagnostic-log-regression"

      - name: Check Insta360 remote protocol
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Models/CameraStorageVolume.swift \
            ActionCamRemote/Models/CameraModels.swift \
            ActionCamRemote/Bluetooth/Insta360RemoteProtocol.swift \
            Tests/Insta360RemoteProtocolRegression.swift \
            -o "$RUNNER_TEMP/insta360-remote-regression"
          "$RUNNER_TEMP/insta360-remote-regression"

      - name: Check Insta360 direct Bluetooth protocols
        # Protocol fixtures run on the host; no simulator or camera is required.
        # X6 captures and synthetic edge cases are identified separately in tests.
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Models/CameraStorageVolume.swift \
            ActionCamRemote/Models/CameraModels.swift \
            ActionCamRemote/Bluetooth/Insta360RemoteProtocol.swift \
            ActionCamRemote/Bluetooth/Insta360DirectProtocol.swift \
            ActionCamRemote/Bluetooth/Insta360DirectSession.swift \
            Tests/Insta360X6ProtocolRegression.swift \
            -o "$RUNNER_TEMP/insta360-x6-regression"
          "$RUNNER_TEMP/insta360-x6-regression"
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Models/CameraStorageVolume.swift \
            ActionCamRemote/Models/CameraModels.swift \
            ActionCamRemote/Bluetooth/Insta360RemoteProtocol.swift \
            ActionCamRemote/Bluetooth/Insta360DirectProtocol.swift \
            ActionCamRemote/Bluetooth/Insta360DirectSession.swift \
            Tests/Insta360X5ProtocolRegression.swift \
            -o "$RUNNER_TEMP/insta360-x5-regression"
          "$RUNNER_TEMP/insta360-x5-regression"

      - name: Check Insta360 heartbeat during UI tracking
        run: sh ci_scripts/check_insta360_transport.sh

      - name: Check Insta360 GPS Remote service and X3 profile
        run: sh ci_scripts/check_insta360_remote_service.sh

      - name: Check Insta360 SDK command confirmation
        run: sh ci_scripts/check_insta360_sdk.sh

      - name: Check Insta360 SDK adapter lifecycle
        run: sh ci_scripts/check_insta360_sdk_adapter.sh

      - name: Check camera storage telemetry
        run: sh ci_scripts/check_camera_telemetry.sh

      - name: Check Watch camera telemetry handoff
        run: sh ci_scripts/check_watch_camera_telemetry.sh

      - name: Check DJI command deadlines
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Models/CameraStorageVolume.swift \
            ActionCamRemote/Models/CameraModels.swift \
            ActionCamRemote/Bluetooth/Insta360RemoteProtocol.swift \
            ActionCamRemote/Bluetooth/DJICommandTracker.swift \
            Tests/DJICommandTrackerRegression.swift \
            -o "$RUNNER_TEMP/dji-command-regression"
          "$RUNNER_TEMP/dji-command-regression"

      - name: Check DJI Stop and pairing lifecycle
        run: sh ci_scripts/check_dji_stop_feedback.sh

      - name: Check discovery during recording
        run: sh ci_scripts/check_camera_discovery.sh

      - name: Check GoPro transport and client lifecycle
        run: sh ci_scripts/check_gopro_transport.sh

      - name: Check recording Stop progress
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Models/CameraStorageVolume.swift \
            ActionCamRemote/Models/CameraModels.swift \
            ActionCamRemote/Bluetooth/Insta360RemoteProtocol.swift \
            Tests/CameraStopProgressRegression.swift \
            -o "$RUNNER_TEMP/stop-progress-regression"
          "$RUNNER_TEMP/stop-progress-regression"

      - name: Check saved command history and support attachment
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Models/CameraStorageVolume.swift \
            ActionCamRemote/Models/CameraModels.swift \
            ActionCamRemote/Bluetooth/Insta360RemoteProtocol.swift \
            ActionCamRemote/Services/DiagnosticLogArchive.swift \
            ActionCamRemote/Services/CommandResultArchive.swift \
            ActionCamRemote/Services/SupportEmailDraft.swift \
            Tests/CommandResultArchiveRegression.swift \
            -o "$RUNNER_TEMP/command-history-regression"
          "$RUNNER_TEMP/command-history-regression"

      - name: Check GoPro stop ordering
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Models/CameraStorageVolume.swift \
            ActionCamRemote/Models/CameraModels.swift \
            ActionCamRemote/Bluetooth/Insta360RemoteProtocol.swift \
            ActionCamRemote/Bluetooth/GoProCommandQueue.swift \
            Tests/GoProCommandQueueRegression.swift \
            -o "$RUNNER_TEMP/gopro-command-queue-regression"
          "$RUNNER_TEMP/gopro-command-queue-regression"

      - name: Check GoPro preset discovery and selection
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Models/CameraStorageVolume.swift \
            ActionCamRemote/Models/CameraModels.swift \
            ActionCamRemote/Bluetooth/Insta360RemoteProtocol.swift \
            ActionCamRemote/Bluetooth/BLECameraDeviceClient.swift \
            ActionCamRemote/Bluetooth/GoProCommandQueue.swift \
            ActionCamRemote/Bluetooth/GoProPresetProtocol.swift \
            ActionCamRemote/Bluetooth/GoProBLEClient.swift \
            Tests/GoProPresetRegression.swift \
            -o "$RUNNER_TEMP/gopro-preset-regression"
          "$RUNNER_TEMP/gopro-preset-regression"

      - name: Check CarPlay camera controls
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Models/CameraStorageVolume.swift \
            ActionCamRemote/Models/CameraModels.swift \
            ActionCamRemote/Bluetooth/Insta360RemoteProtocol.swift \
            ActionCamRemote/CarPlay/CarPlayCameraState.swift \
            Tests/CarPlayCameraStateRegression.swift \
            -o "$RUNNER_TEMP/carplay-camera-regression"
          "$RUNNER_TEMP/carplay-camera-regression"

      - name: Check CarPlay controller observation
        run: sh ci_scripts/check_carplay_controller.sh

      - name: Build
        run: |
          xcodebuild \
            -project ActionCamRemote.xcodeproj \
            -scheme ActionCamRemote \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
