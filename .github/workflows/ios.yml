name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: xcodebuild -version

      - name: Check diagnostic log archive
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Services/DiagnosticLogArchive.swift \
            Tests/DiagnosticLogArchiveRegression.swift \
            -o "$RUNNER_TEMP/diagnostic-log-regression"
          "$RUNNER_TEMP/diagnostic-log-regression"

      - name: Check Insta360 remote protocol
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Models/CameraModels.swift \
            ActionCamRemote/Bluetooth/Insta360RemoteProtocol.swift \
            Tests/Insta360RemoteProtocolRegression.swift \
            -o "$RUNNER_TEMP/insta360-remote-regression"
          "$RUNNER_TEMP/insta360-remote-regression"

      - name: Check GoPro stop ordering
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Models/CameraModels.swift \
            ActionCamRemote/Bluetooth/Insta360RemoteProtocol.swift \
            ActionCamRemote/Bluetooth/GoProCommandQueue.swift \
            Tests/GoProCommandQueueRegression.swift \
            -o "$RUNNER_TEMP/gopro-command-queue-regression"
          "$RUNNER_TEMP/gopro-command-queue-regression"

      - name: Check CarPlay camera controls
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Models/CameraModels.swift \
            ActionCamRemote/Bluetooth/Insta360RemoteProtocol.swift \
            ActionCamRemote/CarPlay/CarPlayCameraState.swift \
            Tests/CarPlayCameraStateRegression.swift \
            -o "$RUNNER_TEMP/carplay-camera-regression"
          "$RUNNER_TEMP/carplay-camera-regression"

      - name: Check CarPlay controller observation
        run: sh ci_scripts/check_carplay_controller.sh

      - name: Build
        run: |
          xcodebuild \
            -project ActionCamRemote.xcodeproj \
            -scheme ActionCamRemote \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
