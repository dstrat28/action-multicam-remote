name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: xcodebuild -version

      - name: Check diagnostic log archive
        run: |
          xcrun swiftc -parse-as-library \
            ActionCamRemote/Services/DiagnosticLogArchive.swift \
            Tests/DiagnosticLogArchiveRegression.swift \
            -o "$RUNNER_TEMP/diagnostic-log-regression"
          "$RUNNER_TEMP/diagnostic-log-regression"

      - name: Build
        run: |
          xcodebuild \
            -project ActionCamRemote.xcodeproj \
            -scheme ActionCamRemote \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
